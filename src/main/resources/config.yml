# ============================================================================
#  Araignée d'horreur - configuration
#  Après modification : /horror reload  (ou redémarrer le serveur)
#  Les durées sont en secondes, les vitesses en blocs par tick (20 ticks = 1 s).
# ============================================================================

behavior:
  follow-range: 260.0           # distance max à laquelle elle suit un joueur (15 chunks = 240 blocs)
  see-range: 64.0               # distance max à laquelle le joueur peut la "voir"
  see-angle: 55.0               # demi-angle du champ de vision, en degrés (plus grand = elle est vue plus facilement)
  require-line-of-sight: true   # false = elle est "vue" même à travers un mur
  ignore-creative: false        # true = ignore les joueurs en créatif
  closest-approach: 5.0         # distance où elle s'arrête et fixe le joueur tant qu'il ne l'a pas vue

  # Approche : de très loin elle avance vite, de près elle avance doucement
  far-distance: 70.0            # au-delà, elle se déplace à far-speed
  far-speed: 0.3
  stalk-phase-seconds:          # toutes les 1 à 4 s elle change de vitesse...
    min: 1.0
    max: 4.0
  stalk-stop-chance: 0.25       # ...et s'arrête net avec cette probabilité
  stalk-min-speed-factor: 0.15  # sinon elle ralentit jusqu'à 15 % de sa vitesse de marche

  # Regard insistant : si tu la fixes trop longtemps ou trop souvent, elle ne patiente plus
  aggro:
    stare-seconds: 3.0          # fixée en continu pendant ce temps (après s'être figée) -> elle charge
    looks-limit: 3              # plus de 3 regards récents -> elle charge juste après le suivant
    looks-decay-seconds: 30.0   # le compteur de regards baisse de 1 toutes les 30 s
    rush-seconds:               # délai avant la charge dans ces deux cas
      min: 1.0
      max: 3.0

  # Chance par seconde qu'elle disparaisse en pleine charge (0 = jamais)
  vanish-during-charge-chance-per-second: 0.15

  freeze-seconds:               # attente après avoir été vue, tirée au hasard, avant de charger
    min: 1.0
    max: 10.0

  charge-max-seconds: 7.0       # durée max d'une charge avant qu'elle abandonne
  stalk-speed: 0.05             # marche lente (taille 1) -> ~1 bloc/s
  charge-speed: 0.4             # course (taille 1) -> ~8 blocs/s
  charge-speed-cap: 0.6         # vitesse de course maximale, même quand elle est géante

  attack:
    range: 1.0                  # portée de l'attaque (s'ajoute à la taille des pattes)
    damage: 4.0                 # 4.0 = 2 coeurs. Mettre 0 pour un simple jumpscare sans dégâts
    knockback: 0.6
    calm-seconds: 2.0           # après une attaque, elle ne peut pas se figer de nouveau pendant ce temps

scale:
  enabled: true
  start: 0.5                    # taille à l'apparition : petite, c'est plus flippant
  calm-max: 3.0                 # taille max des changements aléatoires (3.0 = elle peut devenir grande quand elle veut)
  min: 0.4                      # taille minimale (1 = taille normale)
  max: 3.0                      # taille maximale (atteinte quand elle charge / au screamer)
  change-interval:              # délai aléatoire entre deux changements de taille
    min: 4.0
    max: 14.0
  transition-steps: 8           # nombre de "paliers" pour grandir/rétrécir (1 = changement instantané)
  ticks-per-step: 2
  grow-on-charge: true          # elle grossit quand elle se met à charger

# IA : comportements qui font peur
ai:
  grow-when-seen-chance: 0.5    # probabilité qu'elle gonfle quand on la regarde
  ambush:                       # réapparaît dans ton dos quand tu ne la vois plus depuis un moment
    chance-per-second: 0.08
    unseen-seconds: 4.0
    min-distance: 12.0
    max-distance: 28.0
  burst:                        # petits sprints quand tu ne regardes pas
    chance: 0.2
    speed: 0.28
  predictive-charge: true       # pendant la charge, elle vise où tu vas (et plus où tu es)
  skitter-chance-per-second: 0.5  # figée, elle fait de brusques écarts latéraux en te fixant

# Camouflage : les pièces du corps prennent la couleur du décor derrière elle (vu depuis le joueur).
# Le camouflage reste actif dans tous les états (y compris la charge). Les yeux restent rouges.
camouflage:
  enabled: true
  fade-speed: 0.15              # vitesse du fondu avec le décor

# Angoisse : effets ambiants qui montent avec la proximité de l'araignée
dread:
  enabled: true
  heartbeat:                    # battements de cœur de plus en plus rapides et forts
    enabled: true
    distance: 35.0
  fake-noises:                  # bruits dans ton dos (porte, pas, souffle...) quand tu ne la vois pas
    enabled: true
    distance: 60.0
    interval-seconds:
      min: 4.0
      max: 12.0
  darkness-pulses:              # l'écran s'assombrit par à-coups quand elle est proche
    enabled: true
    distance: 22.0
    interval-seconds:
      min: 3.0
      max: 8.0
  whispers:                     # messages brouillés dans la barre d'action
    enabled: true
    interval-seconds:
      min: 15.0
      max: 40.0
  silence-on-freeze: true       # quand elle se fige, tous les sons s'arrêtent d'un coup
  fear-on-freeze: true          # tu es pétrifié (lenteur + noir) quand elle se fige
  charge-effects: true          # cri strident + nausée + noir au début de la charge
  aftermath: true               # sonné, dans le noir après l'attaque
  particles: true               # cendres et âmes autour d'elle, poussière rouge en charge

# Screamer au moment où elle t'atteint : cri, écran noir, titre rouge, araignée énorme
screamer:
  enabled: true
  grow-to-max: true
  blindness-seconds: 1.5
  darkness-seconds: 4.0
  silence-first: true           # tous les sons coupés une fraction de seconde avant le cri
  force-look: true              # la caméra se tourne de force vers elle
  freeze-seconds: 1.5           # le joueur est paralysé pendant le screamer (0 = non)
  flicker: true                 # titre qui clignote blanc/rouge/noir avec du texte brouillé
  vanish-chance: 0.4            # probabilité qu'elle disparaisse dans le noir juste après
  vanish-delay-seconds: 3.0

# Fuite : quand on la voit, elle peut reculer (en sautant) ou courir se cacher derrière des blocs,
# attendre, puis ressortir ou bondir si tu passes près.
evade:
  enabled: true
  hide-chance: 0.25             # probabilité d'aller se cacher quand on la voit
  retreat-chance: 0.25          # probabilité de reculer (le reste : elle se fige comme avant)
  cooldown-seconds:
    min: 8.0
    max: 20.0
  calm-seconds-after: 2.0
  retreat-speed: 0.18
  retreat-seconds:
    min: 1.0
    max: 2.5
  retreat-hop-chance: 0.6       # saute en arrière
  hide-speed: 0.25
  hide-search-radius: 14.0
  hide-min-player-distance: 6.0
  hide-max-travel-seconds: 6.0
  hide-wait-seconds:
    min: 4.0
    max: 12.0
  hide-leap-chance: 0.5         # bondit vers sa cachette
  hide-ambush-distance: 9.0     # si tu passes à moins de ça, elle peut bondir de sa cachette
  hide-ambush-chance-per-second: 0.5
  hide-pounce-when-seen-chance: 0.35

jump:
  enabled: true
  power: 0.45
  forward: 0.25
  cooldown-seconds: 1.5
  lunge-distance: 9.0           # bond final pendant la charge
  lunge-chance-per-tick: 0.08

# Mini-araignée : à chaque apparition, une chance d'avoir une toute petite version, très rapide, qui s'approche
# tout près sans qu'on la remarque, se faufile partout et te saute au visage. (/horror mini pour en invoquer une)
mini:
  chance: 0.20
  scale: 0.2                # taille (0.2 = de la taille d'une main)
  speed-boost: 3.5          # vitesse de déplacement x ce facteur (sinon elle serait trop lente)
  closest-approach: 2.5     # distance à laquelle elle s'arrête quand on la regarde
  attack-range: 1.6
  pounce-distance: 5.0      # portée de ses bonds depuis un mur / plafond
  see-range-factor: 0.35    # on la repère de beaucoup moins loin (x portée de vue normale)
  damage-factor: 0.5        # dégâts de morsure x ce facteur
  spawn-max-chunks: 3.0     # elle apparaît plus près du joueur (en chunks)

# Serveur multijoueur : elle change de victime au lieu de rester sur le même joueur.
multiplayer:
  target-switch-min-seconds: 45     # elle garde une cible entre min et max secondes, puis en choisit une autre
  target-switch-max-seconds: 120
  switch-after-attack-chance: 0.8   # chance de changer de victime juste après une attaque
  victim-memory-seconds: 600        # les joueurs visés récemment ont moins de chances d'être re-choisis (spawn compris)

# Murs et plafonds : elle grimpe aux murs, marche au plafond, passe les arêtes, et se jette sur toi d'en haut.
# (/horror climb force le comportement pour tester)
climb:
  enabled: true
  turn-rate: 0.07               # vitesse de rotation du corps vers une nouvelle surface (radians par tick)
  sense-interval-ticks: 2       # fréquence de détection des murs / arêtes
  lock-ticks: 10                # délai minimal entre deux changements de surface (évite les va-et-vient)
  seek-chance-per-second: 0.10  # quand tu ne la vois pas, chance d'aller chercher un mur à escalader
  seek-min-distance: 10.0       # distance au joueur à laquelle elle peut décider de grimper
  seek-max-distance: 60.0
  seek-wall-range: 18.0         # portée de recherche d'un mur
  seek-max-seconds: 25.0        # durée max d'une escalade volontaire
  cooldown-seconds: 20.0        # délai avant de pouvoir recommencer
  descend-height: 2.5           # si le joueur est plus bas que ça, elle redescend le long des arêtes au lieu de s'arrêter
  pounce:
    enabled: true               # bond depuis un mur / le plafond
    distance: 10.0              # portée du bond
    drop-distance: 6.0          # sous cette distance elle se jette même si tu la regardes
    cooldown-seconds: 2.0
  silk-thread: true             # fil de soie visible quand elle se laisse tomber du plafond
  scratch-sounds: true          # grattements quand elle est sur un mur / au plafond
  ceiling-ambush-chance: 0.5    # l'embuscade peut la faire apparaître au plafond, derrière toi

# true = une seule araignée à la fois (/horror spawn remplace l'ancienne)
single-spider: true

# Couleurs utilisées quand le camouflage est coupé ou pendant la charge
colors:
  enabled: true
  fade-speed: 0.04              # vitesse du fondu entre deux couleurs (petit = lent et inquiétant)
  piece-variation: 0.03         # légère variation de ton entre les pièces du corps
  change-interval:
    min: 3.0
    max: 9.0
  # Couleurs en hexadécimal. Une couleur est tirée au hasard selon l'état de l'araignée.
  calm:                         # marche lente
    - "#0a0a0a"
    - "#14081f"
    - "#0c1a0c"
    - "#1c0a0a"
  alert:                        # figée, juste après avoir été vue
    - "#5c0000"
    - "#c9c3a5"
    - "#3b0f4d"
  charge:                       # pendant la charge
    - "#ff1111"
    - "#a30000"
    - "#e8e8e8"

sounds:
  enabled: true
  ambient-seconds:              # sifflements d'ambiance qui viennent de sa direction
    min: 6.0
    max: 20.0

# Apparition automatique près des joueurs. Désactive avec enabled: false
# (le délai check-seconds n'est lu qu'au démarrage du serveur)
auto-spawn:
  enabled: true
  check-seconds: 6.0
  chance: 0.7                   # probabilité à chaque vérification
  only-at-night: false
  min-chunks: 1.0               # distance d'apparition : de 1 à 15 chunks du joueur
  max-chunks: 15.0
  max-per-player: 1
  max-total: 1                  # nombre total d'araignées sur le serveur
  despawn-seconds: 60.0         # disparaît si aucun joueur n'est à portée pendant ce temps
